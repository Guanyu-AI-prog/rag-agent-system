<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 管理后台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px 30px; }
        .header h1 { font-size: 24px; font-weight: 600; }
        .header .subtitle { opacity: 0.8; font-size: 14px; margin-top: 4px; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* 指标卡片 */
        .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .metric-card .label { font-size: 13px; color: #888; margin-bottom: 8px; }
        .metric-card .value { font-size: 28px; font-weight: 700; }
        .metric-card .value.green { color: #22c55e; }
        .metric-card .value.red { color: #ef4444; }
        .metric-card .value.blue { color: #3b82f6; }
        .metric-card .value.orange { color: #f59e0b; }
        .metric-card .sub { font-size: 12px; color: #aaa; margin-top: 4px; }

        /* 图表区域 */
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        .chart-card h3 { font-size: 16px; margin-bottom: 16px; color: #555; }
        .chart-container { position: relative; height: 300px; }

        /* 表格 */
        .table-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
        .table-card h3 { font-size: 16px; margin-bottom: 16px; color: #555; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background: #f8f9fa; font-weight: 600; color: #666; }
        tr:hover { background: #f8f9fa; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 500; }
        .badge.success { background: #dcfce7; color: #16a34a; }
        .badge.error { background: #fee2e2; color: #dc2626; }
        .question-text { max-width: 400px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* 控制栏 */
        .controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
        .controls select, .controls button { padding: 8px 16px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
        .controls button { background: #667eea; color: white; border: none; cursor: pointer; }
        .controls button:hover { background: #5a6fd6; }

        /* 分页 */
        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; }
        .pagination button { padding: 6px 12px; border: 1px solid #ddd; border-radius: 6px; background: white; cursor: pointer; }
        .pagination button.active { background: #667eea; color: white; border-color: #667eea; }
        .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }

        @media (max-width: 768px) {
            .charts { grid-template-columns: 1fr; }
            .metrics { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📊 RAG 管理后台</h1>
        <div class="subtitle">套餐知识库 Agent 监控面板</div>
    </div>

    <div class="container">
        <!-- 控制栏 -->
        <div class="controls">
            <select id="daysSelect" onchange="loadData()">
                <option value="1">最近 1 天</option>
                <option value="7" selected>最近 7 天</option>
                <option value="30">最近 30 天</option>
                <option value="90">最近 90 天</option>
            </select>
            <button onclick="loadData()">🔄 刷新</button>
            <button onclick="clearOldLogs()">🗑️ 清理旧日志</button>
        </div>

        <!-- 指标卡片 -->
        <div class="metrics">
            <div class="metric-card">
                <div class="label">总查询数</div>
                <div class="value blue" id="totalQueries">-</div>
                <div class="sub" id="periodLabel">最近 7 天</div>
            </div>
            <div class="metric-card">
                <div class="label">成功率</div>
                <div class="value green" id="successRate">-</div>
                <div class="sub" id="successLabel">-</div>
            </div>
            <div class="metric-card">
                <div class="label">错误数</div>
                <div class="value red" id="errorCount">-</div>
                <div class="sub" id="errorLabel">-</div>
            </div>
            <div class="metric-card">
                <div class="label">平均响应时间</div>
                <div class="value orange" id="avgLatency">-</div>
                <div class="sub" id="latencyRange">-</div>
            </div>
        </div>

        <!-- 图表 -->
        <div class="charts">
            <div class="chart-card">
                <h3>📈 每日查询趋势</h3>
                <div class="chart-container">
                    <canvas id="dailyChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3>🕐 每小时分布</h3>
                <div class="chart-container">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>
        </div>

        <!-- 热门问题 -->
        <div class="table-card">
            <h3>🔥 热门问题 TOP 20</h3>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>问题</th>
                        <th>查询次数</th>
                        <th>成功率</th>
                        <th>平均耗时</th>
                        <th>最近查询</th>
                    </tr>
                </thead>
                <tbody id="hotQuestionsBody"></tbody>
            </table>
        </div>

        <!-- 查询日志 -->
        <div class="table-card">
            <h3>📋 查询日志</h3>
            <div class="controls" style="margin-bottom: 12px;">
                <select id="logFilter" onchange="loadLogs(1)">
                    <option value="">全部</option>
                    <option value="true">仅成功</option>
                    <option value="false">仅失败</option>
                </select>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>时间</th>
                        <th>问题</th>
                        <th>回答</th>
                        <th>状态</th>
                        <th>耗时</th>
                        <th>会话</th>
                    </tr>
                </thead>
                <tbody id="logsBody"></tbody>
            </table>
            <div class="pagination" id="logsPagination"></div>
        </div>
    </div>

    <script>
        let dailyChart = null;
        let hourlyChart = null;
        let currentLogPage = 1;

        async function loadData() {
            const days = document.getElementById('daysSelect').value;
            document.getElementById('periodLabel').textContent = `最近 ${days} 天`;

            try {
                const [stats, hotQuestions] = await Promise.all([
                    fetch(`/admin/stats?days=${days}`).then(r => r.json()),
                    fetch(`/admin/hot_questions?days=${days}&limit=20`).then(r => r.json())
                ]);

                updateMetrics(stats);
                updateCharts(stats);
                updateHotQuestions(hotQuestions);
                loadLogs(1);
            } catch (e) {
                console.error('加载数据失败:', e);
            }
        }

        function updateMetrics(stats) {
            const total = stats.total_queries;
            const successRate = total > 0 ? ((stats.success_count / total) * 100).toFixed(1) : 0;

            document.getElementById('totalQueries').textContent = total;
            document.getElementById('successRate').textContent = successRate + '%';
            document.getElementById('successLabel').textContent = `${stats.success_count} 成功 / ${stats.error_count} 失败`;
            document.getElementById('errorCount').textContent = stats.error_count;
            document.getElementById('errorLabel').textContent = `错误率 ${stats.error_rate}%`;
            document.getElementById('avgLatency').textContent = stats.avg_latency.toFixed(1) + 's';
            document.getElementById('latencyRange').textContent = `最快 ${stats.min_latency.toFixed(1)}s / 最慢 ${stats.max_latency.toFixed(1)}s`;
        }

        function updateCharts(stats) {
            // 每日趋势
            const dailyCtx = document.getElementById('dailyChart').getContext('2d');
            if (dailyChart) dailyChart.destroy();

            const dailyLabels = stats.daily.map(d => d.day);
            const dailySuccess = stats.daily.map(d => d.success);
            const dailyErrors = stats.daily.map(d => d.errors);

            dailyChart = new Chart(dailyCtx, {
                type: 'bar',
                data: {
                    labels: dailyLabels,
                    datasets: [
                        { label: '成功', data: dailySuccess, backgroundColor: '#22c55e', borderRadius: 4 },
                        { label: '失败', data: dailyErrors, backgroundColor: '#ef4444', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { stacked: true },
                        y: { stacked: true, beginAtZero: true }
                    },
                    plugins: { legend: { position: 'top' } }
                }
            });

            // 每小时分布
            const hourlyCtx = document.getElementById('hourlyChart').getContext('2d');
            if (hourlyChart) hourlyChart.destroy();

            const allHours = Array.from({length: 24}, (_, i) => i);
            const hourlyMap = {};
            stats.hourly.forEach(h => hourlyMap[h.hour] = h.count);
            const hourlyData = allHours.map(h => hourlyMap[h] || 0);

            hourlyChart = new Chart(hourlyCtx, {
                type: 'line',
                data: {
                    labels: allHours.map(h => `${h}:00`),
                    datasets: [{
                        label: '查询数',
                        data: hourlyData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4,
                        pointRadius: 4,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: { y: { beginAtZero: true } },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function updateHotQuestions(questions) {
            const tbody = document.getElementById('hotQuestionsBody');
            tbody.innerHTML = questions.map((q, i) => {
                const successRate = q.query_count > 0 ? ((q.success_count / q.query_count) * 100).toFixed(0) : 0;
                const lastTime = new Date(q.last_query_time * 1000).toLocaleString('zh-CN');
                return `
                    <tr>
                        <td>${i + 1}</td>
                        <td class="question-text" title="${escapeHtml(q.question)}">${escapeHtml(q.question)}</td>
                        <td><strong>${q.query_count}</strong></td>
                        <td><span class="badge ${successRate >= 80 ? 'success' : 'error'}">${successRate}%</span></td>
                        <td>${q.avg_latency.toFixed(1)}s</td>
                        <td>${lastTime}</td>
                    </tr>
                `;
            }).join('');
        }

        async function loadLogs(page) {
            currentLogPage = page;
            const days = document.getElementById('daysSelect').value;
            const filter = document.getElementById('logFilter').value;
            let url = `/admin/logs?page=${page}&page_size=30&days=${days}`;
            if (filter) url += `&success=${filter}`;

            try {
                const data = await fetch(url).then(r => r.json());
                const tbody = document.getElementById('logsBody');
                tbody.innerHTML = data.logs.map(log => {
                    const time = new Date(log.timestamp * 1000).toLocaleString('zh-CN');
                    const status = log.success ? '<span class="badge success">成功</span>' : '<span class="badge error">失败</span>';
                    const answer = log.answer ? log.answer.substring(0, 80) + (log.answer.length > 80 ? '...' : '') : '-';
                    const session = log.session_id ? log.session_id.substring(0, 8) + '...' : '-';
                    return `
                        <tr>
                            <td>${time}</td>
                            <td class="question-text" title="${escapeHtml(log.question)}">${escapeHtml(log.question)}</td>
                            <td class="question-text" title="${escapeHtml(answer)}">${escapeHtml(answer)}</td>
                            <td>${status}</td>
                            <td>${log.processing_time ? log.processing_time.toFixed(1) + 's' : '-'}</td>
                            <td>${session}</td>
                        </tr>
                    `;
                }).join('');

                // 分页
                const pagination = document.getElementById('logsPagination');
                let paginationHtml = '';
                if (data.total_pages > 1) {
                    paginationHtml += `<button ${page <= 1 ? 'disabled' : ''} onclick="loadLogs(${page - 1})">上一页</button>`;
                    for (let i = 1; i <= Math.min(data.total_pages, 10); i++) {
                        paginationHtml += `<button class="${i === page ? 'active' : ''}" onclick="loadLogs(${i})">${i}</button>`;
                    }
                    paginationHtml += `<button ${page >= data.total_pages ? 'disabled' : ''} onclick="loadLogs(${page + 1})">下一页</button>`;
                }
                pagination.innerHTML = paginationHtml;
            } catch (e) {
                console.error('加载日志失败:', e);
            }
        }

        async function clearOldLogs() {
            if (!confirm('确定要清理超过 30 天的日志吗？')) return;
            try {
                const result = await fetch('/admin/clear_old_logs?days=30', { method: 'POST' }).then(r => r.json());
                alert(result.message);
                loadData();
            } catch (e) {
                alert('清理失败: ' + e.message);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 页面加载时获取数据
        loadData();
        // 每 60 秒自动刷新
        setInterval(loadData, 60000);
    </script>
</body>
</html>
