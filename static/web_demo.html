<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 问答系统</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #4a5568;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #4a5568;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f7fafc;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }
        .result.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        .result h3 {
            color: #4a5568;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .answer {
            color: #2d3748;
            line-height: 1.8;
            font-size: 16px;
            white-space: pre-wrap;
        }
        .sources {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }
        .sources h4 {
            color: #718096;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .source-item {
            background: #edf2f7;
            padding: 8px 12px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-size: 13px;
            color: #4a5568;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .status {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #718096;
        }
        .api-info {
            background: #edf2f7;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            font-size: 13px;
            color: #4a5568;
        }
        .api-info code {
            background: #2d3748;
            color: #e2e8f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Monaco', 'Consolas', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦌 LangChain RAG 问答系统</h1>
        <p class="subtitle">基于LangChain + SiliconFlow API的检索增强生成系统</p>
        
        <div class="form-group">
            <label for="question">请输入您的问题：</label>
            <input type="text" id="question" placeholder="例如：有哪些套餐？" value="有哪些套餐？">
        </div>
        
        <button id="submitBtn" onclick="askQuestion()">🔍 查询</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在思考中，请稍候...</p>
        </div>
        
        <div class="result" id="result">
            <h3>💡 回答</h3>
            <div class="answer" id="answer"></div>
            
            <div class="sources" id="sources">
                <h4>📚 来源文档</h4>
                <div id="sourcesList"></div>
            </div>
        </div>
        
        <div class="api-info">
            <p>API端点：<code>http://47.114.108.91:8000/query</code></p>
            <p>API文档：<code>http://47.114.108.91:8000/docs</code></p>
            <p>当前时间：<span id="currentTime"></span></p>
        </div>
        
        <div class="status">
            <p>✅ API服务运行正常 | 向量库：7个文档块 | 模型：GLM-4-9B-0414</p>
        </div>
    </div>

    <script>
        // 更新当前时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 查询函数
        async function askQuestion() {
            const question = document.getElementById('question').value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            // 显示加载状态
            submitBtn.disabled = true;
            loading.classList.add('show');
            result.classList.remove('show');
            
            try {
                const response = await fetch('http://47.114.108.91:8000/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        session_id: 'web_demo_' + Date.now()
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                // 显示结果
                document.getElementById('answer').textContent = data.answer;
                
                // 显示来源
                const sourcesList = document.getElementById('sourcesList');
                if (data.sources && data.sources.length > 0) {
                    sourcesList.innerHTML = data.sources.map(source => 
                        `<div class="source-item">${source}</div>`
                    ).join('');
                    document.getElementById('sources').style.display = 'block';
                } else {
                    document.getElementById('sources').style.display = 'none';
                }
                
                result.classList.add('show');
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('answer').textContent = `查询失败: ${error.message}`;
                result.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        // 回车键提交
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                askQuestion();
            }
        });
        
        // 页面加载时测试API连接
        window.onload = async function() {
            try {
                const response = await fetch('http://47.114.108.91:8000/health');
                const status = document.querySelector('.status p');
                if (response.ok) {
                    status.textContent = '✅ API服务运行正常 | 向量库：7个文档块 | 模型：GLM-4-9B-0414';
                } else {
                    status.textContent = '⚠️ API服务响应异常';
                    status.style.color = '#ed8936';
                }
            } catch (error) {
                const status = document.querySelector('.status p');
                status.textContent = '❌ 无法连接到API服务';
                status.style.color = '#e53e3e';
            }
        };
    </script>
</body>
</html>
